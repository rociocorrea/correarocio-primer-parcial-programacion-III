<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Supercars Olivos: una selección curada de autos nobles, deportivos y superdeportivos." />

    <title>Supercars Olivos</title>
    <link rel="icon" type="image/png" href="assets/icono.png">
    <link rel="stylesheet" href="index.css">

    <!-- Importación de js con 'defer' para que se ejecute luego de que 
     se cargue el HTML -->
    <script src="index.js" defer></script>

    <!-- Importación de fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <img class="icono" src="assets/icono.png" alt="Icono de Supercars Olivos">
        <div class="titulo">
            <h1>Supercars Olivos</h1>
            <h4>Una selección curada de autos nobles, deportivos y superdeportivos</h4>
        </div>
    </header>
    <main>
        <section class="hero">
            <strong>DESCUBRÍ</strong>
            <strong>NUESTRA</strong>
            <strong>COLECCIÓN</strong>
        </section>

        <section id="deportivos">
            <h2 class="titulo-seccion">Nobles y deportivos</h2>
            <div class="imagenes" id="noblesydeportivos"></div>
        </section>

        <section id="superdeportivos">
            <h2 class="titulo-seccion">Premiums y superdeportivos</h2>
            <div class="imagenes" id="premiumysuperdeportivos"></div>
        </section>
    </main>

    <footer class="footer">
        <span>2026 - Supercars Olivos</span>
    </footer>
</body>

</html>
